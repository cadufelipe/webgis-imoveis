# Ativo com --spring.profiles.active=dev (ou SPRING_PROFILES_ACTIVE=dev).
#
# O que esta aqui e barulho util em desenvolvimento e problema em producao:
# show-sql escreve toda consulta no stdout, o que em volume derruba a
# throughput e enche o disco de log — e ainda expoe a estrutura do banco.

spring.jpa.show-sql=true
logging.level.br.com.webgis=DEBUG
