spring.application.name=webgis-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/webgis
# Sobrescreva por variavel de ambiente onde a senha nao puder ficar no arquivo.
# O padrao depois dos dois-pontos mantem o setup do README funcionando sem
# configurar nada.
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_SENHA:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate: o Hibernate apenas confere se o schema bate com as entidades.
# Ele nao cria nem altera mais nada por conta propria.
spring.jpa.hibernate.ddl-auto=validate
# false: a sessao do Hibernate fecha ao fim da transacao, nao ao fim da resposta.
# Com true, uma consulta que esquecesse o fetch join do ImovelSpecs carregaria o
# proprietario preguicosamente na serializacao — o N+1 voltaria em silencio.
# Agora esse esquecimento falha alto, com LazyInitializationException.
# Seguro porque todo mapeamento para DTO ja acontece dentro de @Transactional.
spring.jpa.open-in-view=false

# Flyway roda antes do JPA e e a unica fonte do schema.
# Migrations em src/main/resources/db/migration.
spring.flyway.enabled=true

# Paginacao: teto de itens por pagina, para um ?size=1000000 nao derrubar o servidor.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Origens autorizadas a chamar a API (separadas por virgula).
webgis.cors.origens-permitidas=http://localhost:4200
